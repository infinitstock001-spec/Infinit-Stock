<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Gracias! | Urban Dog's</title>
<meta name="description" content="Recibimos tu mensaje. Te respondemos por WhatsApp en menos de 24 horas.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0C0A09">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600&family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/urban.css">
<style>
  .gracias { min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 60px 20px;
    background: radial-gradient(900px 520px at 50% 0%, rgba(247,179,43,.18), transparent 62%), var(--ink); }
  .gracias__box { max-width: 620px; }
  .gracias__dog { width: 260px; margin: 0 auto 26px; animation: ud-hover 5s ease-in-out infinite; }
  .gracias h1 { font-family: var(--f-display); font-size: clamp(2.4rem, 7vw, 4.2rem); line-height: .95; text-transform: uppercase; margin-bottom: 18px; }
  .gracias p { color: var(--text-soft); font-size: 1.06rem; margin-bottom: 14px; }
  .gracias__acciones { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
  .gracias__cupon { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; padding: 14px 24px;
    border-radius: var(--r-pill); background: rgba(247,179,43,.14); box-shadow: inset 0 0 0 1px var(--line);
    font-family: var(--f-display); letter-spacing: .16em; color: var(--mustard); font-size: 1.1rem; }
</style>
</head>
<body>
<main class="gracias">
  <div class="gracias__box">
    <div class="gracias__dog" id="g-dog"></div>
    <span class="sec__kicker" style="justify-content:center">Mensaje recibido</span>
    <h1>¡Gracias!<br><span class="grad-text">Ya te leímos</span></h1>
    <p>Te vamos a escribir por WhatsApp en menos de 24 horas. Si es urgente, escribinos vos ahora mismo y lo resolvemos al toque.</p>
    <div class="gracias__cupon" id="g-cupon">CUPÓN: URBAN10</div>
    <p style="font-size:.9rem;color:var(--text-dim);margin-top:10px">Usalo en el carrito para tu primer pedido.</p>
    <div class="gracias__acciones">
      <a class="btn btn--lg btn--wa" id="g-wa" href="#" target="_blank" rel="noopener">Escribinos por WhatsApp</a>
      <a class="btn btn--lg btn--ghost" href="index.html">Volver al inicio</a>
    </div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/art.js"></script>
<script>
  document.body.insertAdjacentHTML('afterbegin', UD_ART.defs());
  document.getElementById('g-dog').innerHTML = UD_ART.pancho(
    { pan: 'brioche', salchicha: 'doble', toppings: ['bacon','cebolla'], salsas: ['cheddar','ketchup'] },
    { seed: 'gracias' }
  );
  var num = String(UD_CONFIG.contacto.whatsapp).replace(/\D/g, '');
  document.getElementById('g-wa').href = 'https://wa.me/' + num +
    '?text=' + encodeURIComponent('¡Hola ' + UD_CONFIG.marca.nombre + '! Les escribí por la web y quería seguir la consulta por acá.');
  var cup = (UD_CONFIG.ventas.cupones[0] || {}).codigo;
  if (cup) document.getElementById('g-cupon').textContent = 'CUPÓN: ' + cup;
</script>
</body>
</html>
