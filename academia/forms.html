<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<title>Formularios internos — Infinit Academy</title>
<meta name="robots" content="noindex, nofollow">
</head>
<body>
<!-- ==============================================================
     Esta página no la ve nadie. Existe para que Netlify sepa qué
     formularios tiene el sitio y te guarde las respuestas.

     Las ves en: app.netlify.com → tu sitio → Forms
     Para que te lleguen por mail: Forms → Settings → Form notifications
     ============================================================== -->

<form name="inscripcion" data-netlify="true" hidden>
  <input type="text" name="pedido">
  <input type="text" name="curso">
  <input type="text" name="total">
  <input type="text" name="cupon">
  <input type="text" name="medio">
  <input type="text" name="nombre">
  <input type="email" name="email">
  <input type="text" name="whatsapp">
  <input type="text" name="dni">
  <input type="text" name="ciudad">
</form>

<form name="clase-gratis" data-netlify="true" hidden>
  <input type="text" name="nombre">
  <input type="email" name="email">
  <input type="text" name="tel">
  <input type="text" name="interes">
</form>

<form name="consulta" data-netlify="true" hidden>
  <input type="text" name="nombre">
  <input type="email" name="email">
  <input type="text" name="tel">
  <textarea name="mensaje"></textarea>
</form>

<p>Página interna. <a href="index.html">Volver al inicio</a>.</p>
</body>
</html>
